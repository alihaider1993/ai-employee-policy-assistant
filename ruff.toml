# Lint config. Only real errors (pyflakes plus syntax and import-order errors), not style.
extend-exclude = [".venv", "data"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# alembic needs the model import for its side effect: it fills Base.metadata.
"alembic/env.py" = ["E402", "F401"]
# New models are exported here so alembic autogenerate can see them.
"app/models/__init__.py" = ["F401"]
